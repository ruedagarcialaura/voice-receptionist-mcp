<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Front Desk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root { --blue: #2563eb; --ink: #0f172a; --muted: #64748b; --line: #e8edf5; --bg: #f6f8fc; }
      * { box-sizing: border-box; }
      body {
        margin: 0; color: var(--ink); font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        background-color: var(--bg);
        background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
        background-size: 40px 40px;
      }
      main { max-width: 1120px; margin: 0 auto; padding: 32px 16px; }
      header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
      .eyebrow { display: inline-block; font-size: 13px; color: var(--muted); background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }
      h1 { font-size: 34px; line-height: 1.1; margin: 12px 0 4px; letter-spacing: -0.02em; }
      h1 span { color: var(--blue); }
      h2 { font-size: 16px; margin: 0 0 12px; }
      .muted { color: var(--muted); font-size: 14px; }
      .live { display: inline-flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 600; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #16a34a; }
      .dot.off { background: #dc2626; }
      .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
      .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 20px; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04); }
      .kpi .label { font-size: 14px; color: var(--muted); }
      .kpi .value { display: inline-block; margin-top: 10px; font-size: 28px; font-weight: 700; padding: 2px 12px; border-radius: 10px; background: #eff6ff; color: var(--blue); }
      .kpi.red .value { background: #fef2f2; color: #dc2626; }
      .kpi.green .value { background: #ecfdf5; color: #059669; }
      .kpi.amber .value { background: #fffbeb; color: #d97706; }
      section.card + section.card { margin-top: 24px; }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); }
      td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
      tr:last-child td { border-bottom: none; }
      tr.new { background: #ecfdf5; }
      .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
      .pill.booked, .pill.ok { background: #ecfdf5; color: #059669; }
      .pill.cancelled { background: #f1f5f9; color: #64748b; }
      .pill.rescheduled { background: #fffbeb; color: #d97706; }
      .pill.err { background: #fef2f2; color: #dc2626; }
      code { font-size: 12px; color: var(--muted); word-break: break-all; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
