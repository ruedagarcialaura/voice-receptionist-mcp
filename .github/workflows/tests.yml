# Continuous integration: run the full test suite on every push and pull request.
# No secrets needed: the tests use a temporary SQLite database, a frozen clock
# and a fake LLM, so they never call external APIs.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v
